[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "krx-rs-monitor"
version = "0.1.0"
description = "KOSPI + KOSDAQ relative strength screener"
requires-python = ">=3.11"
dependencies = ["pykrx==1.2.9", "pandas>=2.2,<3", "requests>=2.32", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
krx-rs = "krx_rs_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
